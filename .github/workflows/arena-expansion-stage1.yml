name: ARENA 5.0 stage 1 - The Awakening
on:
  push:
    branches: [expansion/pc-stage-01-awakening]
    paths: [.github/workflows/arena-expansion-stage1.yml]
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download exact reviewed source snapshot
        run: |
          curl --fail --location --max-time 120 --output /tmp/arena-stage1.zip 'https://arena-filhos-da-areia.floot.app/_cdn/static/030c10b6-1300-40db-8a9d-1cf45af397f1-arena-pc-expansion-stage1-source.zip'
          echo '6dd60f849efc089580b9bb4b711b2d3bb424e3b016f496e8ec9ed03205dfe6ea  /tmp/arena-stage1.zip' | sha256sum --check
      - name: Extract only inside the isolated PC expansion directory
        run: |
          python3 - <<'PY'
          import zipfile,pathlib
          target=pathlib.Path('pc-expansion').resolve()
          target.mkdir(exist_ok=True)
          with zipfile.ZipFile('/tmp/arena-stage1.zip') as z:
            for item in z.infolist():
              path=(target/item.filename).resolve()
              if not path.is_relative_to(target): raise ValueError('Unsafe archive path')
              if (item.external_attr >> 16) & 0o170000 == 0o120000: raise ValueError('Unexpected symlink')
            z.extractall(target)
          PY
      - name: Install locked build dependencies
        working-directory: pc-expansion
        run: npm ci --no-audit --no-fund
      - name: Typecheck, build and test
        working-directory: pc-expansion
        run: |
          npm run typecheck
          npm run build
          npm test
      - name: Commit the verified source without touching main
        run: |
          test "$GITHUB_REF_NAME" = 'expansion/pc-stage-01-awakening'
          git config user.name 'ARENA build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pc-expansion
          if ! git diff --cached --quiet; then
            git commit -m 'ARENA 5.0 — Etapa 1: O Despertar; original art and combat preserved'
            git push origin HEAD:expansion/pc-stage-01-awakening
          fi
      - name: Keep independently verified portable build
        uses: actions/upload-artifact@v4
        with:
          name: arena-expansion-stage1-tested
          path: |
            pc-expansion/dist/ARENA_FILHOS_DA_AREIA_PC.html
            pc-expansion/dist/build-report.json
            pc-expansion/dist/test-report.json
            pc-expansion/dist/stage1-test-report.json
          retention-days: 14
